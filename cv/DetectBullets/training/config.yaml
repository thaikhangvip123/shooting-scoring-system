dataset:
  train_dir: data/bullet_patch/train
  val_dir: data/bullet_patch/val
  test_dir: data/bullet_patch/test

model:
  name: mobilenetv3_small
  input_size: 96
  pretrained: true
  resume_path: ""

training:
  epochs: 30
  batch_size: 32
  learning_rate: 0.0001
  optimizer: adamw
  weight_decay: 0.0001
  scheduler: cosine
  class_weights: true
  label_smoothing: 0.03
  num_workers: 2
  seed: 42

output:
  model_path: cv/DetectBullets/models/mobilenetv3_bullet.pt
  onnx_path: cv/DetectBullets/models/mobilenetv3_bullet.onnx
  results_dir: cv/DetectBullets/results
